<div class="card shadow-sm rounded-3 border-0 mb-4">
  <!-- Image -->
  <img src="{{ listing.image.url }}" class="card-img-top" alt="{{ listing.model }}" style="height: 200px; object-fit: cover;">

  <!-- Card Body -->
  <div class="card-body d-flex flex-column">
    <!-- Model Title -->
    <h5 class="fw-bold text-danger mb-2">{{ listing.model }}</h5>

    <!-- Seller Info -->
    <div class="d-flex align-items-center mb-3">
      <img src="{{ listing.seller.photo.url }}" class="rounded-circle me-2" height="32" width="32" style="object-fit: cover;">
      <small class="text-muted">{{ listing.seller.user.username }}</small>
    </div>

    <!-- Description Clamp -->
    <p class="text-muted description-clamp mb-2">{{ listing.description }}</p>

    <!-- Read More (Link to Detail Page) -->
    <a href="{% url 'listing' id=listing.id %}" class="btn btn-link btn-sm p-0 mb-3 text-primary">Read more</a>

    <!-- Buttons and Like -->
    <div class="d-flex justify-content-between align-items-center mt-auto flex-wrap">
      <!-- View & Edit -->
      <div class="btn-group">
        <a href="{% url 'listing' id=listing.id %}" class="btn btn-sm btn-outline-primary rounded-pill">View</a>
        {% if listing.seller.user == request.user %}
        <a href="{% url 'edit' id=listing.id %}" class="btn btn-sm btn-outline-secondary rounded-pill">Edit</a>
        {% endif %}
      </div>

      <!-- Timestamp and Like -->
      <div class="d-flex align-items-center gap-2 mt-2 mt-sm-0">
        <small class="text-muted">{{ listing.updated_at|date:"M d, Y" }}</small>
        <button id="like_{{ listing.id }}" class="btn btn-light rounded-circle border p-1 d-flex align-items-center justify-content-center" style="width: 38px; height: 38px;">
          <svg id="heart-svg-{{ listing.id }}" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="{% if listing.id in liked_listings_ids %}red{% else %}black{% endif %}">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 
                     2 5.42 4.42 3 7.5 3c1.74 0 3.41 0.81 
                     4.5 2.09C13.09 3.81 14.76 3 16.5 3 
                     19.58 3 22 5.42 22 8.5c0 3.78-3.4 
                     6.86-8.55 11.54L12 21.35z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Clamp Styling -->
<style>
  .description-clamp {
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-overflow: ellipsis;
  }
</style>

<!-- AJAX Like Toggle -->
<script>
  $("#like_{{ listing.id }}").click(function () {
    $.ajax({
      type: "POST",
      url: "{% url 'like_listing' id=listing.id %}",
      data: { 'csrfmiddlewaretoken': '{{ csrf_token }}' },
      dataType: "json",
      success: function (r) {
        const heart = document.getElementById("heart-svg-{{ listing.id }}");
        heart.setAttribute("fill", r.is_liked_by_user ? "red" : "black");
      },
      error: function (rs, e) {
        alert(e);
      }
    });
  });
</script>

{% extends 'base/base.html' %}
{% load static %}
{% load crispy_forms_tags %}

{% block 'body' %}
<style>
  .edit-container {
    background: linear-gradient(to right, #f8f9fa, #e9ecef);
    border-radius: 12px;
    padding: 3rem 2rem;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
    max-width: 100%;
    overflow-x: hidden;
  }

  .form-section {
    background-color: #ffffff;
    padding: 2rem;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.03);
  }

  .form-title {
    font-weight: 700;
    font-size: 2.2rem;
    color: #dc3545;
    border-bottom: 2px solid #dc3545;
    display: inline-block;
    padding-bottom: 0.4rem;
  }

  .btn-danger {
    font-weight: 600;
    padding: 0.6rem 2rem;
    border-radius: 50px;
    transition: all 0.3s ease-in-out;
  }

  .btn-danger:hover {
    transform: scale(1.02);
    background-color: #bb2d3b;
  }

  /* Prevent unwanted horizontal scrolling */
  html, body {
    overflow-x: hidden;
  }

  /* Make form title responsive */
  @media (max-width: 768px) {
    .form-title {
      font-size: 1.6rem;
      text-align: center;
      border-bottom: none;
    }
  }

  /* Adjust padding for small screens */
  @media (max-width: 576px) {
    .edit-container {
      padding: 1.5rem 1rem;
    }
    .form-section {
      padding: 1.2rem;
    }
    .btn-danger {
      width: 100%; /* Full width button */
      padding: 0.7rem;
    }
  }

  /* Stack form fields vertically on small screens */
  @media (max-width: 768px) {
    .row.g-4 > [class*="col-"] {
      flex: 0 0 100%;
      max-width: 100%;
    }
    .text-end {
      text-align: center !important;
    }
  }
</style>

<div class="container py-5">
  <div class="edit-container">
    <div class="row mb-4 text-center">
      <div class="col">
        <h2 class="form-title">Edit Listing</h2>
      </div>
    </div>

    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      <div class="row g-4">
        <div class="col-md-6">
          <div class="form-section">
            {{ listing_form|crispy }}
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-section">
            {{ location_form|crispy }}
          </div>
        </div>
      </div>
      <div class="text-end mt-4">
        <button type="submit" class="btn btn-danger btn-lg">Save Changes</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
